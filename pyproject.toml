[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pantry-pal"
version = "0.1.0"
description = "Pantry inventory and recipe app"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "alembic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "mypy",
    "ruff"
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]